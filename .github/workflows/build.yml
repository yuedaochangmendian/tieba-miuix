#
# 贴吧 Miuix 的 CI：把工程编译成 APK 并作为 artifact 上传。
#
# 签名（可选）：在仓库 Settings -> Secrets 里配置下面四个值即可自动签名，
# 不配置也能构建（release APK 未签名，可直接安装调试）。
#   KEYSTORE_BASE64   —— 你的 keystore 文件经 `base64 -w0 xxx.jks` 得到的字符串
#   KEYSTORE_PASS     —— keystore 口令
#   KEY_ALIAS         —— 密钥别名
#   KEY_PASSWORD      —— 密钥口令
name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  # 打 tag 时需要用 GITHUB_TOKEN 创建 Release，故给写权限；其余场景只会读取。
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Configure signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.keystore"
            {
              echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/release.keystore"
              echo "KEYSTORE_PASS=$KEYSTORE_PASS"
              echo "KEY_ALIAS=$KEY_ALIAS"
              echo "KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Release keystore configured."
          else
            echo "No keystore secrets provided; the release APK will be unsigned."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: |
          ./gradlew assembleRelease --stacktrace \
            || {
              echo "::warning::assembleRelease failed, falling back to assembleDebug."
              ./gradlew assembleDebug --stacktrace
            }

      - name: Collect APKs
        if: always()
        run: |
          echo "---- APK outputs ----"
          find app/build/outputs/apk -name '*.apk' -print 2>/dev/null || true

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tieba-miuix-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          fail_on_unmatched_files: false
